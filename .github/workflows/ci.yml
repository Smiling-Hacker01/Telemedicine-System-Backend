name: CI / CD Quality Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Strict Typecheck & Code Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Strict TypeScript Compilation
        run: npm run typecheck

      - name: Check Formatting
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  test-and-coverage:
    name: Automated Test Suite & Coverage Gates
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_secure_pass
          POSTGRES_DB: amrutam_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://amrutam_user:amrutam_secure_pass@localhost:5434/amrutam_test?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_minimum_32_characters_long
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_minimum_32_characters_long
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: whsec_ci_test_secret_32_characters_minimum_length

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Run Test Suite with Coverage Gates
        run: npm run test:coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: amrutam-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
